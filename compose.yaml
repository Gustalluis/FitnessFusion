services:
  db:
    image: postgres:17          # mesma versão principal do Supabase
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data   # dados sobrevivem ao desligar o container
volumes:
  pgdata:
